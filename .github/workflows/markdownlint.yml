name: Markdown lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/markdownlint.json'
      - '.github/workflows/markdownlint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint changed Markdown files
        shell: bash
        run: |
          config=".github/workflows/markdownlint.json"
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- "$config" | grep -q .; then
            npx --yes markdownlint-cli2 --config "$config" "**/*.md" "#node_modules"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.md')
          if ((${#files[@]} == 0)); then
            echo "No Markdown files changed."
            exit 0
          fi
          npx --yes markdownlint-cli2 --config "$config" "${files[@]}"
