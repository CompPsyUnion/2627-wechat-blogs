name: Markdown lint

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint changed Markdown files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          config=".github/workflows/markdownlint.json"
          if [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
          else
            base="$BASE_SHA"
          fi

          if [[ "$base" == "0000000000000000000000000000000000000000" ]] || \
             git diff --name-only "$base...HEAD" -- "$config" | grep -q .; then
            npx --yes markdownlint-cli2 --config "$config" "**/*.md" "#node_modules"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "$base...HEAD" -- '*.md')
          if ((${#files[@]} == 0)); then
            echo "No Markdown files changed."
            exit 0
          fi
          npx --yes markdownlint-cli2 --config "$config" "${files[@]}"
