<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250"><rect width="960" height="250" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#1e293b"><text x="480" y="42" font-size="23" font-weight="bold">从已有空间创建新卷 / Create a new volume</text><rect x="38" y="76" width="245" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="120" font-size="21" font-weight="bold">1. 压缩 C: 盘</text><text x="160" y="150" font-size="16">Shrink C:</text><rect x="358" y="76" width="245" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="480" y="120" font-size="21" font-weight="bold">2. 未分配空间</text><text x="480" y="150" font-size="16">Unallocated space</text><rect x="678" y="76" width="245" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="800" y="120" font-size="21" font-weight="bold">3. 新建简单卷</text><text x="800" y="150" font-size="16">New simple volume</text><text x="480" y="220" font-size="17" fill="#475569">示意图，实际盘符和大小可能不同 / Drive letters and sizes may differ</text></g><g stroke="#475569" stroke-width="3" fill="#475569"><path d="M290 126H348M610 126H668" fill="none"/><path d="M348 126l-11 -7v14zM668 126l-11 -7v14z"/></g></svg>
