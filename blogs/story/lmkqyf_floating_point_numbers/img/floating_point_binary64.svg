<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="720" rx="32" fill="#f8fafc"/>
  <text x="700" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="32" font-weight="700" fill="#0f172a">三个浮点数案例 / Three Floating-Point Cases</text>

  <text x="170" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="700" fill="#475569">输入 / Input</text>
  <text x="500" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="700" fill="#475569">二进制表示 / Binary representation</text>
  <text x="885" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="700" fill="#475569">运算 / Operation</text>
  <text x="1230" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="700" fill="#475569">比较 / Comparison</text>

  <!-- Case 1 -->
  <g filter="url(#shadow)">
    <rect x="45" y="135" width="250" height="145" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="340" y="135" width="320" height="145" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <rect x="705" y="135" width="360" height="145" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <rect x="1110" y="135" width="245" height="145" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  </g>
  <text x="170" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#1e3a8a">0.1 + 0.2</text>
  <text x="170" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1e40af">两个近似值相加</text>
  <text x="500" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#4c1d95">0011 0011 0011…</text>
  <text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5b21b6">循环展开，存储时舍入</text>
  <text x="500" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6d28d9">Repeating binary fractions, rounded</text>
  <text x="885" y="184" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#92400e">精确和恰好位于中点</text>
  <text x="885" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#a16207">ties-to-even 选择偶数尾数</text>
  <text x="885" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b45309">The upper neighbour is selected</text>
  <text x="1232" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#991b1b">0.30000000000000004</text>
  <text x="1232" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#b91c1c">≠ 0.3</text>
  <text x="1232" y="251" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dc2626">False</text>

  <line x1="305" y1="208" x2="326" y2="208" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="670" y1="208" x2="691" y2="208" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1075" y1="208" x2="1096" y2="208" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Case 2 -->
  <g filter="url(#shadow)">
    <rect x="45" y="315" width="250" height="145" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <rect x="340" y="315" width="320" height="145" rx="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <rect x="705" y="315" width="360" height="145" rx="20" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
    <rect x="1110" y="315" width="245" height="145" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  </g>
  <text x="170" y="375" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#075985">0.2 + 0.2</text>
  <text x="170" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0369a1">相同浮点数相加</text>
  <text x="500" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#6b21a8">0.2 本身仍是近似值</text>
  <text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7e22ce">0.2 is still approximate</text>
  <text x="885" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#3f6212">翻倍只移动指数</text>
  <text x="885" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d7c0f">Doubling shifts the exponent</text>
  <text x="1232" y="374" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#166534">== 0.4</text>
  <text x="1232" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#16a34a">True</text>

  <line x1="305" y1="388" x2="326" y2="388" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="670" y1="388" x2="691" y2="388" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1075" y1="388" x2="1096" y2="388" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Case 3 -->
  <g filter="url(#shadow)">
    <rect x="45" y="495" width="250" height="145" rx="20" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
    <rect x="340" y="495" width="320" height="145" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <rect x="705" y="495" width="360" height="145" rx="20" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
    <rect x="1110" y="495" width="245" height="145" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  </g>
  <text x="170" y="555" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#155e75">0.5</text>
  <text x="170" y="597" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0e7490">十进制小数</text>
  <text x="500" y="554" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#4c1d95">0.1₂ = 2⁻¹</text>
  <text x="500" y="596" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6d28d9">有限展开 / Terminates</text>
  <text x="885" y="554" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#065f46">小数部分全为 0</text>
  <text x="885" y="594" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#047857">All fraction bits are zero</text>
  <text x="1232" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">精确表示</text>
  <text x="1232" y="594" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#16a34a">Exact</text>

  <line x1="305" y1="568" x2="326" y2="568" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="670" y1="568" x2="691" y2="568" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1075" y1="568" x2="1096" y2="568" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="700" y="686" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="18" fill="#475569">浮点数是否“看起来正确”，取决于表示与舍入过程 / Results depend on representation and rounding</text>
</svg>
